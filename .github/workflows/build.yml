name: Build and verify Linux package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    env:
      XDG_CONFIG_HOME: /tmp/splate-ci-config
      XDG_DATA_HOME: /tmp/splate-ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y zbar-tools gsettings-desktop-schemas xvfb xauth
      - name: Build and run behavioral checks
        run: |
          dotnet publish tests/PortChecks -c Release -r linux-x64 --self-contained true -o dist/checks
          dist/checks/PortChecks "$PWD"
      - name: Check proxy operations on the model dispatcher
        run: GSETTINGS_BACKEND=keyfile dist/checks/PortChecks --proxy-only
      - name: Verify real TUN and incoming connections
        run: sudo python3 tests/network_namespace_check.py
      - name: Check Linux settings and Android balancer UI
        env:
          NODE_PATH: /tmp/splate-ui-deps/node_modules
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm install --prefix /tmp/splate-ui-deps playwright@1.62.1
          /tmp/splate-ui-deps/node_modules/.bin/playwright install --with-deps chromium
          node tests/balancer-linux-ui.cjs
          node tests/connection-lan-ui.cjs
      - name: Publish and package
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -o dist/linux-x64
          sh scripts/build-deb.sh
          python3 scripts/verify-package.py
      - name: Install package and open its native window as an ordinary user
        run: |
          sudo apt-get install -y ./dist/splatevpn_*_amd64.deb
          test -x /usr/libexec/splatevpn-network
          getcap /opt/splatevpn/core/xray.bin | grep cap_net_raw
          SPLATE_UI_BUILD=/opt/splatevpn dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" python3 tests/ui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: splatevpn-linux-x64
          path: dist/*.deb
